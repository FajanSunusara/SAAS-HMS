# =========== SERVER CONFIG ===========
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-stacktrace=on_param

# =========== DATABASE CONFIGURATION ===========
# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_reception
spring.datasource.username=postgres
spring.datasource.password=root

# HikariCP Connection Pool Settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=true

# =========== JPA/HIBERNATE CONFIGURATION ===========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.show_sql=true

# Batch processing
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Enable statistics (optional, for debugging)
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.open-in-view=false

# =========== REDIS CONFIGURATION ===========
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0
spring.data.redis.jedis.pool.max-wait=1000ms

# =========== CACHE CONFIGURATION ===========
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=hotel:
spring.cache.redis.use-key-prefix=true

# Redis Pub/Sub
app.redis.pubsub.room-topic=hotel:room:events
app.redis.pubsub.notification-topic=hotel:notifications

# =========== LOGGING ===========
logging.level.com.hotel.reception=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.data.redis=DEBUG
#logging.level.io.lettuce.core=WARN  # Change to DEBUG if using Lettuce
logging.level.redis.clients.jedis=DEBUG
logging.file.name=logs/hotel-backend.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =========== SWAGGER/OPENAPI ===========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# =========== APPLICATION CONFIG ===========
spring.application.name=hotel-reception-backend
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jackson.default-property-inclusion=non_null

# =========== WEBSOCKET CONFIGURATION ===========
spring.websocket.allowed-origins=*
spring.websocket.sockjs.enabled=true

# =========== SPRING SECURITY (if added later) ===========
# spring.security.user.name=admin
# spring.security.user.password=admin
# spring.security.oauth2.resourceserver.jwt.issuer-uri=

# =========== FILE UPLOAD CONFIGURATION ===========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========== DEVTOLS ===========
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# Pagination defaults
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Guest Detail API Configuration
app.guest-detail.cache-enabled=true
app.guest-detail.cache-ttl=300000




