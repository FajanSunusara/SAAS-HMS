# =========== SERVER CONFIG ===========
server.port=8080
server.servlet.context-path=/api

# =========== DATABASE CONFIGURATION ===========
# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_reception
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# =========== JPA/HIBERNATE CONFIGURATION ===========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable batch inserts for better debugging
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =========== REDIS CONFIG (Optional - Comment if not using) ===========
 spring.data.redis.host=localhost
 spring.data.redis.port=6379
 spring.cache.type=redis

# =========== LOGGING ===========
logging.level.com.hotel.reception=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/hotel-backend.log

# =========== SWAGGER/OPENAPI ===========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# =========== APPLICATION CONFIG ===========
spring.application.name=hotel-reception-backend
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=Asia/Kolkata

# =========== DEVTOLS ===========
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true